<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="canonical" href="https://www.yifanfilm.com/">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Yifan Zhang</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:site_name" content="Yifan Zhang">
<meta property="og:title" content="Yifan Zhang">
<meta property="og:description" content="Yifan Zhang 张轶凡 — director and screenwriter. Film, AIGC and visual storytelling.">
<meta property="og:image" content="https://www.yifanfilm.com/og.jpg">
<meta property="og:url" content="https://www.yifanfilm.com/">
<meta name="twitter:card" content="summary_large_image">
<meta name="description" content="Yifan Zhang 张轶凡 — director and screenwriter. Film, AIGC and visual storytelling.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=IBM+Plex+Mono:wght@400&family=Noto+Serif+SC:wght@300;400&display=swap">
<style>
/* Layout: one dark screening room. A full-bleed still is the screen; titles float around the name like a constellation; every other view is a quiet sheet laid over the blurred screen. */
:root{
  --ink:#0b0c0d;          /* projection-room black, faint cool bias */
  --ink-2:#141618;        /* raised sheet */
  --paper:#e8e4dc;        /* warm print white */
  --mute:#8e8c87;         /* captions */
  --faint:rgba(232,228,220,.14); /* hairlines */
  --steel:#93a7bb;        /* the blue of the deck's light beam, used rarely */
  --serif:'Cormorant Garamond','Noto Serif SC',Georgia,serif;
  --cjk:'Noto Serif SC','Songti SC','STSong','SimSun',serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --ease:cubic-bezier(.7,0,.2,1);
  --soft:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--cjk);font-weight:300;-webkit-font-smoothing:antialiased;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:1px solid var(--steel);outline-offset:4px}
.mono{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}

/* ---------- screen ---------- */
#stage{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--ink);transition:filter 1.1s var(--soft),opacity 1.1s var(--soft)}
#stage .kb{position:absolute;inset:0}
/* each still gets its own slow push-in, like a dolly move, starting fresh on every cut */
#stage .frame{position:absolute;inset:0;transform-origin:var(--ox,50%) var(--oy,50%);animation:push 18s cubic-bezier(.25,.1,.35,1) forwards;will-change:transform}
#stage .layer,#stage .slice{position:absolute;inset:0;background-size:cover;background-position:center}
#stage .slice{transition:clip-path 1.05s var(--ease)}
#stage .shade{position:absolute;inset:0;background:
  radial-gradient(ellipse at center,rgba(11,12,13,.15) 0%,rgba(11,12,13,.55) 70%,rgba(11,12,13,.85) 100%),
  linear-gradient(to bottom,rgba(11,12,13,.45),rgba(11,12,13,0) 18%,rgba(11,12,13,0) 78%,rgba(11,12,13,.6))}
#grain{position:absolute;inset:0;width:100%;height:100%;opacity:.03;pointer-events:none}
body.away #stage{filter:blur(26px) brightness(.38) saturate(.8)}
body.deep #stage{opacity:0}
#stage.boot{opacity:0}
@keyframes push{from{transform:scale(1)}to{transform:scale(1.18)}}

/* ---------- nav ---------- */
.nav{position:fixed;inset:0 0 auto;z-index:40;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:calc(18px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 18px max(20px,env(safe-area-inset-left,0px));
  animation:fade 1s 1.5s both}
.nav .home{justify-self:start;display:flex;gap:.9em;align-items:baseline}
.nav .home .cn{font-family:var(--cjk);font-size:12px;letter-spacing:.2em;text-transform:none;color:var(--mute)}
.nav .links{display:flex;gap:2.4em}
.nav .lang{justify-self:end;display:flex;gap:.6em;align-items:center;color:var(--mute)}
.nav a,.nav button{transition:color .3s,opacity .3s}
.nav .links a{opacity:.72}
.nav .links a:hover,.nav .links a[aria-current="page"]{opacity:1}
.nav .links a::before,.slash::before{content:"/\00a0";color:var(--mute)}
.lang button{color:var(--mute)}
.lang button[aria-pressed="true"]{color:var(--paper)}
.lang .cjkbtn{font-family:var(--cjk);font-size:12px}

/* ---------- home ---------- */
#home{position:fixed;inset:0;z-index:10;transition:opacity .8s var(--soft)}
body:not(.at-home) #home{opacity:0;pointer-events:none}
.name{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;width:max-content;max-width:90vw}
.name h1{margin:0;font-family:var(--serif);font-weight:300;font-size:clamp(44px,6.4vw,96px);line-height:1;letter-spacing:-.005em}
.name h1 span{display:inline-block;white-space:pre}
.name .sub{margin-top:1.1em;display:flex;gap:1.4em;justify-content:center;align-items:baseline;flex-wrap:wrap;color:rgba(232,228,220,.78)}
.name .sub .cn{font-family:var(--cjk);font-size:13px;letter-spacing:.42em;margin-right:-.42em}
.name .cue{display:none}
body.intro .name h1 span{animation:letter 1.25s var(--soft) both;animation-delay:calc(.25s + var(--i) * 70ms)}
body.intro .name .sub{animation:fade 1.2s 1.15s both}

.stars{list-style:none;margin:0;padding:0}
.star{position:absolute;left:clamp(100px,var(--x),calc(100% - 100px));top:var(--y);transform:translate(-50%,-50%);}
body.intro .star{animation:fade 1.1s both;animation-delay:calc(1.45s + var(--i) * 70ms)}
.star a{display:grid;gap:.45em;justify-items:center;text-align:center;padding:10px 14px;transition:opacity .5s var(--soft)}
.star .no{color:var(--mute)}
.star .zh{font-family:var(--cjk);font-size:15px;letter-spacing:.14em;font-weight:400;white-space:nowrap}
.star .zh i{font-style:normal;display:inline-block}
.star .en{color:rgba(232,228,220,.7);white-space:nowrap}
.stars:hover .star a,.stars.focus .star a{opacity:.32}
.stars .star a:hover,.stars .star a:focus-visible,.stars.focus .star.on a{opacity:1}
.star.on .no{color:var(--steel)}
.star a:hover .zh i{animation:flick .7s var(--soft) both;animation-delay:calc(var(--c) * 55ms)}

.hud{position:absolute;z-index:5;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:end;gap:16px;pointer-events:none;
  padding:0 max(20px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  color:var(--mute);animation:fade 1s 1.8s both}
.hud .now{display:flex;gap:1em;align-items:baseline;min-width:0}
.hud .now b{font-weight:400;color:var(--paper);font-family:var(--cjk);font-size:12px;letter-spacing:.14em;text-transform:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .tc{font-variant-numeric:tabular-nums;white-space:nowrap}
/* the recording dot is the hidden door */
.hud .tc{display:flex;align-items:center}
.rec{pointer-events:auto;display:inline-grid;place-items:center;width:22px;height:22px;margin:-8px 4px -8px -8px;cursor:pointer}
.rec::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--steel);animation:rec 2s steps(1) infinite;transition:transform .4s var(--soft),background .4s}
.rec:hover::before,.rec:focus-visible::before{animation:none;background:var(--paper);transform:scale(1.6)}

/* the note */
.note{max-width:34em;margin:0 auto;padding-top:clamp(20px,6vh,80px)}
.note .kicker{text-align:center;margin-bottom:56px}
.note p{margin:0 0 1.4em;font-family:var(--serif);font-size:clamp(20px,2vw,25px);line-height:1.6;text-wrap:pretty}
.note:lang(zh) p{font-family:var(--cjk);font-size:clamp(17px,1.6vw,19px);line-height:2.1;letter-spacing:.05em}
.note .sign{margin-top:64px;text-align:center;color:var(--mute)}

/* ---------- sheets (work / about / project) ---------- */
.view{position:fixed;inset:0;z-index:20;overflow-y:auto;overscroll-behavior:contain;opacity:0;visibility:hidden;transition:opacity .7s var(--soft),visibility 0s .7s;-webkit-overflow-scrolling:touch}
.view.open{opacity:1;visibility:visible;transition:opacity .7s var(--soft)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(110px + env(safe-area-inset-top,0px)) calc(56px + env(safe-area-inset-bottom,0px))}
.inner{max-width:1240px;margin:0 auto;padding-inline:clamp(0px,2.4vw,28px)}
.view.open .rise{animation:rise .9s var(--soft) both;animation-delay:calc(.12s + var(--d,0) * 60ms)}
.kicker{color:var(--mute);margin:0 0 28px}

/* work index */
.group{margin-bottom:72px}
.group h2{margin:0 0 14px;display:flex;gap:1em;align-items:baseline;font-weight:400}
.group h2 .mono{color:var(--mute)}
.group h2 .mono:first-child{color:var(--paper)}
.rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--faint)}
.row a{display:grid;grid-template-columns:3.2em minmax(0,1.1fr) minmax(0,1fr) minmax(0,.9fr) 5em;gap:16px;align-items:baseline;padding:20px 0;border-bottom:1px solid var(--faint);transition:opacity .4s,padding .5s var(--soft)}
.row .zh{font-family:var(--cjk);font-size:clamp(18px,2vw,24px);letter-spacing:.08em}
.row .en{font-family:var(--serif);font-style:italic;font-size:clamp(17px,1.8vw,22px);color:rgba(232,228,220,.82)}
.row .no,.row .kind,.row .yr{color:var(--mute)}
.row .yr{text-align:right;font-variant-numeric:tabular-nums}
.row .kind{text-transform:none;letter-spacing:.04em}
.rows:hover .row a{opacity:.35}
.rows .row a:hover{opacity:1;padding-left:10px}
#peek{position:fixed;left:0;top:0;width:min(320px,30vw);aspect-ratio:3/2;z-index:30;pointer-events:none;opacity:0;transition:opacity .35s;background-size:cover;background-position:center;will-change:transform}
#peek.show{opacity:1}

/* about */
.about{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:clamp(28px,5vw,72px)}
.about > div{min-width:0}
.about h2{margin:0 0 22px;font-weight:400;color:var(--mute)}
.about h2.later{margin-top:56px}
.portrait{margin:0 0 32px;width:96px;height:96px;border-radius:50%;overflow:hidden;background:var(--ink-2)}
.portrait img{display:block;width:100%;height:100%;object-fit:cover;filter:contrast(1.02) brightness(.92)}
.statement{font-family:var(--serif);font-size:clamp(22px,2.3vw,30px);line-height:1.38;margin:0;text-wrap:balance}
.statement:lang(zh){font-family:var(--cjk);font-size:clamp(18px,1.8vw,22px);line-height:1.9;letter-spacing:.04em}
.facts{list-style:none;margin:0;padding:0;display:grid;gap:22px}
.facts li{display:grid;gap:5px}
.facts .k{font-family:var(--serif);font-size:20px}
.facts:lang(zh) .k,.k:lang(zh){font-family:var(--cjk);font-size:16px;letter-spacing:.06em}
.facts .v{color:var(--mute);font-size:13px;line-height:1.6}
.facts .lab{color:var(--mute)}
.facts .links{display:flex;gap:.6em 1.4em;flex-wrap:wrap;color:var(--paper);font-size:13px;line-height:1.6}
.facts a{border-bottom:1px solid var(--faint);transition:border-color .3s}
.facts a:hover{border-color:var(--paper)}
.facts .mail{color:var(--paper);font-family:var(--mono);font-size:13px;word-break:break-all}
.copy{margin-left:.8em;color:var(--steel)}
.foot{margin-top:96px;display:flex;justify-content:space-between;gap:16px;color:var(--mute);flex-wrap:wrap}

/* project */
#project{background:var(--ink)}
#project .wrap{padding-top:0}
.hero{position:relative;margin:0 calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));height:min(88vh,62vw);min-height:320px;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;display:block;animation:settle 2.4s var(--soft) both}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(11,12,13,.55),rgba(11,12,13,0) 22%,rgba(11,12,13,0) 55%,var(--ink))}
.hero .cap{position:absolute;z-index:2;left:0;right:0;bottom:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:clamp(18px,4vw,44px)}
.hero .cap .inner{display:grid;gap:12px}
.hero h1{margin:0;font-family:var(--cjk);font-weight:300;font-size:clamp(34px,5.2vw,72px);letter-spacing:.1em;line-height:1.15}
.hero .en{font-family:var(--serif);font-style:italic;font-size:clamp(20px,2.2vw,30px);color:rgba(232,228,220,.85)}
.hero .no{color:var(--mute);text-transform:none}
.brief{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.2fr);gap:clamp(24px,5vw,80px);padding:48px 0 64px;border-bottom:1px solid var(--faint)}
.meta{list-style:none;margin:0;padding:0;display:grid;gap:14px;align-content:start}
.meta li{display:grid;grid-template-columns:6em 1fr;gap:12px;color:var(--mute)}
.meta li span:last-child{color:var(--paper);text-transform:none;letter-spacing:.04em;line-height:1.6}
.log{margin:0;font-size:clamp(19px,1.9vw,24px);line-height:1.75;letter-spacing:.03em;text-wrap:pretty;max-width:36em}
.log:lang(en){font-family:var(--serif);font-size:clamp(22px,2.2vw,28px);line-height:1.45;letter-spacing:0}
.log2{margin:18px 0 0;color:var(--mute);font-size:14px;line-height:1.8;max-width:42em}
.log2:lang(en){font-family:var(--serif);font-size:17px;line-height:1.5}
.laurels{list-style:none;margin:40px 0 0;padding:24px 0 0;border-top:1px solid var(--faint);display:grid;gap:12px}
.laurels li{display:grid;grid-template-columns:12em 1fr;gap:16px;align-items:baseline}
.laurels .mono{color:var(--steel)}
.laurels span:last-child{font-size:15px;line-height:1.6}
.laurels span:last-child:lang(en){font-family:var(--serif);font-size:18px;line-height:1.4}
.stills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(10px,1.4vw,18px);padding:56px 0 0}
.stills figure{margin:0;display:grid;gap:10px}
.stills button{display:block;overflow:hidden;background:var(--ink-2)}
.stills img{display:block;width:100%;height:auto;transition:transform 1.2s var(--soft),filter .6s}
.stills button:hover img{transform:scale(1.025)}
.stills figcaption{color:var(--mute);font-variant-numeric:tabular-nums}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:96px;border-top:1px solid var(--faint);padding-top:28px}
.pager a{display:grid;gap:10px;min-width:0}
.pager a:last-child{text-align:right;justify-items:end}
.pager .zh{font-size:clamp(20px,2.4vw,30px);letter-spacing:.1em;transition:color .3s}
.pager .mono{color:var(--mute)}
.pager a:hover .zh{color:var(--steel)}

/* lightbox */
#lb{position:fixed;inset:0;z-index:60;background:rgba(6,7,8,.97);display:grid;place-items:center;opacity:0;visibility:hidden;transition:opacity .4s,visibility 0s .4s}
#lb.open{opacity:1;visibility:visible;transition:opacity .4s}
#lb img{max-width:calc(100vw - 48px);max-height:calc(100vh - 140px);object-fit:contain;display:block}
#lb .bar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;padding:0 max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));color:var(--mute)}
#lb .bar .ctl{display:flex;gap:2em}
#lb .x{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));right:max(20px,env(safe-area-inset-right,0px))}

@keyframes letter{from{opacity:0;filter:blur(14px);transform:translateY(.06em)}to{opacity:1;filter:blur(0);transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes flick{0%{filter:blur(0);opacity:1}35%{filter:blur(5px);opacity:.25}100%{filter:blur(0);opacity:1}}
@keyframes settle{from{transform:scale(1.06);filter:brightness(.6)}to{transform:none;filter:none}}
@keyframes rec{0%{opacity:1}50%{opacity:.15}}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}

/* ---------- narrow screens ---------- */
@media (max-width:860px){
  .nav{grid-template-columns:1fr auto}
  .nav .links{grid-column:1/-1;grid-row:2;justify-content:flex-start;margin-top:12px}
  .nav .home .cn{display:none}
  /* phone home: first screen is only the name; scrolling lifts and dissolves it, then the works come up */
  #home{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  .name{position:sticky;left:auto;top:0;width:auto;max-width:none;height:100svh;display:grid;place-content:center;justify-items:center;padding-inline:16px;
    transform:translateY(var(--ny,0px));opacity:var(--no,1);filter:blur(var(--nb,0px));will-change:transform,opacity,filter}
  .name .sub{flex-direction:column;gap:.9em;align-items:center}
  .name .cue{display:block;position:absolute;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));color:var(--mute);animation:fade 1s 1.9s both}
  .name .cue span{display:inline-block;animation:nudge 2.4s ease-in-out infinite}
  .stars{position:relative;z-index:2;margin-top:0;padding:0 max(20px,env(safe-area-inset-left,0px)) calc(90px + env(safe-area-inset-bottom,0px));display:grid;gap:2px}
  .star{position:static;transform:none}
  body.intro .star{animation:none}
  body.io .star{opacity:0;transform:translateY(16px);transition:opacity .9s var(--soft),transform .9s var(--soft)}
  body.io .star.seen{opacity:1;transform:none}
  .star a{grid-template-columns:2.6em auto 1fr;justify-items:start;text-align:left;align-items:baseline;gap:12px;padding:12px 0;border-bottom:1px solid var(--faint)}
  .star .en{justify-self:end;font-size:9.5px;text-align:right;white-space:normal}
  .stars:hover .star a{opacity:1}
  .hud{position:fixed;background:linear-gradient(to top,rgba(11,12,13,.85),rgba(11,12,13,0));padding-top:30px}
  .hud .now{display:none}
  .row a{grid-template-columns:2.4em minmax(0,1fr) auto;row-gap:4px}
  .row .en{grid-column:2/3;grid-row:2}
  .row .kind{grid-column:2/3;grid-row:3}
  .row .yr{grid-column:3;grid-row:1}
  .about{grid-template-columns:1fr}
  .brief{grid-template-columns:1fr}
  .laurels li{grid-template-columns:1fr;gap:4px}
  .stills{grid-template-columns:1fr}
  #peek{display:none}
  body.at-home.scrolled #stage{filter:brightness(.55)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
  #stage .kb{animation:none}
}
</style>
</head>
<body>
<div id="stage" class="boot" aria-hidden="true">
  <div class="kb"></div>
  <div class="shade"></div>
  <canvas id="grain"></canvas>
</div>

<header class="nav mono">
  <a class="home" href="#" data-route=""><span>Yifan Zhang</span><span class="cn">张轶凡</span></a>
  <nav class="links" aria-label="Main">
    <a href="#work" data-t="nav.work">Work</a>
    <a href="#about" data-t="nav.about">About</a>
  </nav>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" id="lang-en" data-lang="en" aria-pressed="true">EN</button>
    <span aria-hidden="true">/</span>
    <button type="button" id="lang-zh" class="cjkbtn" data-lang="zh" aria-pressed="false">中</button>
  </div>
</header>

<main id="home">
  <div class="name" id="namebox">
    <h1 aria-label="Yifan Zhang" id="nameline"></h1>
    <div class="sub"><span class="cn">张轶凡</span><span class="mono" data-t="tagline">Film / AIGC / Visual storytelling</span></div>
    <div class="cue mono" aria-hidden="true"><span data-t="cue">Scroll for work ↓</span></div>
  </div>
  <ul class="stars" id="stars"></ul>
  <div class="hud mono">
    <div class="now"><span data-t="now">Now showing</span><span id="nowno">01</span><b id="nowtitle"></b></div>
    <div class="tc"><a class="rec" href="#note" aria-label="A note"></a><span id="tc">00:00:00:00</span></div>
  </div>
</main>

<section class="view" id="work" aria-label="Work">
  <div class="wrap"><div class="inner" id="workinner"></div></div>

/* ---------- screen + shutter ---------- */
const kb=$('#stage .kb');
let current=null,busy=false,queued=null;
const ORIG=[['50%','50%'],['38%','46%'],['62%','46%'],['50%','36%'],['46%','60%'],['58%','58%']];
function makeFrame(){const f=document.createElement('div');f.className='frame';const o=ORIG[(Math.random()*ORIG.length)|0];
  f.style.setProperty('--ox',o[0]);f.style.setProperty('--oy',o[1]);if(reduced)f.style.animation='none';return f;}
const posOf=src=>{const w=WORKS.find(x=>img(x,x.hero)===src);return (w&&w.pos)||'50% 50%';};
function settle(f,src){const l=document.createElement('div');l.className='layer';l.style.backgroundImage='url("'+src+'")';l.style.backgroundPosition=posOf(src);
  f.replaceChildren(l);[...kb.children].forEach(c=>{if(c!==f)c.remove();});current=src;}
function shutter(src){
  if(src===current&&!busy)return;
  if(busy){queued=src;return;}
  if(reduced){const f=makeFrame();kb.appendChild(f);settle(f,src);return;}
  busy=true;
  const N=window.innerWidth<700?5:8,wrap=makeFrame();
  const slices=[];
  for(let i=0;i<N;i++){
    const s=document.createElement('div');s.className='slice';
    s.style.backgroundImage='url("'+src+'")';s.style.backgroundPosition=posOf(src);
    const L=(i*100/N),R=(100-(i+1)*100/N);
    s.style.clipPath=(i%2)?'inset(100% '+R+'% 0 calc('+L+'% - 1px))':'inset(0 '+R+'% 100% calc('+L+'% - 1px))';
    s.style.transitionDelay=(Math.abs(i-(N-1)/2)*75)+'ms';
    s.dataset.to='inset(0 '+R+'% 0 calc('+L+'% - 1px))';
    wrap.appendChild(s);slices.push(s);
  }
  kb.appendChild(wrap);
  const go=()=>requestAnimationFrame(()=>requestAnimationFrame(()=>slices.forEach(s=>s.style.clipPath=s.dataset.to)));
  const pre=new Image();pre.onload=pre.onerror=go;pre.src=src;
  setTimeout(()=>{settle(wrap,src);busy=false;if(queued&&queued!==current){const q=queued;queued=null;shutter(q);}else queued=null;},1050+Math.ceil(N/2)*75+80);
}

const CH='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
function scramble(el){
  const final=el.dataset.text;let f=0;const total=16;
  cancelAnimationFrame(el._r);
  const step=()=>{f++;const k=Math.floor(final.length*f/total);
    el.textContent=final.split('').map((c,i)=>i<k||c===' '?c:CH[(Math.random()*CH.length)|0]).join('');
    if(f<total)el._r=requestAnimationFrame(()=>setTimeout(step,28));else el.textContent=final;};
  step();
}

});

const cv=$('#grain'),cx=cv.getContext('2d');const tiles=[];
for(let n=0;n<5;n++){const c=document.createElement('canvas');c.width=c.height=192;const g=c.getContext('2d');const d=g.createImageData(192,192);
  for(let p=0;p<d.data.length;p+=4){const v=(Math.random()*255)|0;d.data[p]=d.data[p+1]=d.data[p+2]=v;d.data[p+3]=255;}g.putImageData(d,0,0);tiles.push(c);}
function sizeGrain(){cv.width=Math.ceil(innerWidth/1.5);cv.height=Math.ceil(innerHeight/1.5);}
sizeGrain();addEventListener('resize',sizeGrain);
let last=0;
function grain(ts){
  if(ts-last>70){last=ts;const pat=cx.createPattern(tiles[(Math.random()*tiles.length)|0],'repeat');
    cx.save();cx.translate(-(Math.random()*192)|0,-(Math.random()*192)|0);cx.fillStyle=pat;cx.fillRect(0,0,cv.width+192,cv.height+192);cx.restore();}
  if(!reduced)requestAnimationFrame(grain);
}
requestAnimationFrame(grain);

     '<ul class="facts" style="margin-top:36px" lang="'+lang+'"><li><span class="mono lab">'+t('focus')+'</span><span class="k">'+t('focusV')+'</span></li></ul></div>'+
   '<div class="rise" style="--d:2"><h2 class="mono slash">'+t('edu')+'</h2><ul class="facts" lang="'+lang+'">'+
     '<li><span class="k">'+t('edu1k')+'</span><span class="v">'+t('edu1v')+'</span></li>'+
     '<li><span class="k">'+t('edu2k')+'</span><span class="v">'+t('edu2v')+'</span></li></ul>'+
     '<h2 class="mono slash later">'+t('laurels')+'</h2><ul class="facts" lang="'+lang+'">'+
     laurels.map(({w,a})=>'<li><span class="k">'+a[lang]+'</span><span class="v">'+a.r[lang]+(lang==='zh'?'，':', ')+'<a href="#'+w.id+'">'+(lang==='zh'?'《'+w.zh+'》':'<i>'+w.en+'</i>')+'</a></span></li>').join('')+'</ul></div>'+
   '<div class="rise" style="--d:3"><h2 class="mono slash">'+t('contact')+'</h2><ul class="facts">'+
     '<li><span class="mono lab">'+t('email')+'</span><span class="mail"><a href="mailto:'+EMAIL+'">'+EMAIL+'</a><button type="button" class="copy mono" id="copybtn">'+t('copy')+'</button></span></li>'+
     '<li><span class="mono lab">'+t('elsewhere')+'</span><span class="links">'+
       LINKS.map(l=>'<a href="'+l[2]+'" target="_blank" rel="noopener">'+(lang==='zh'?l[1]:l[0])+'</a>').join('')+'</span></li>'+
     '<li><span class="mono lab">'+t('basedLab')+'</span><span class="links">'+t('based')+'</span></li></ul></div>'+
  '</div><div class="foot mono rise" style="--d:5"><span>© 2026 Yifan Zhang 张轶凡</span><span>yifanfilm.com</span></div>';
  $('#copybtn').addEventListener('click',e=>{const b=e.currentTarget;
    const done=()=>{b.textContent=t('copied');setTimeout(()=>b.textContent=t('copy'),1600);};
    try{navigator.clipboard.writeText(EMAIL).then(done,()=>selectEmail(b));}catch(err){selectEmail(b);}});
}
function selectEmail(b){const a=b.previousElementSibling;const r=document.createRange();r.selectNodeContents(a);const s=getSelection();s.removeAllRanges();s.addRange(r);}

/* ---------- project ---------- */
let lbList=[],lbI=0;
function renderProject(w){
  const i=WORKS.indexOf(w),prev=WORKS[(i+WORKS.length-1)%WORKS.length],next=WORKS[(i+1)%WORKS.length];
  const other=lang==='zh'?'en':'zh';
  let stills='';
  for(let k=1;k<=w.n;k++)stills+='<figure class="rise" style="--d:'+(k+4)+'"><button type="button" data-k="'+k+'" aria-label="'+w.en+' still '+k+'"><img src="'+img(w,k)+'" alt="'+w.en+', still '+k+'" loading="lazy"></button><figcaption class="mono">'+pad(k)+'</figcaption></figure>';
  const laurels=(w.awards||[]).length?'<ul class="laurels">'+w.awards.map(a=>'<li><span class="mono">'+a.r[lang]+'</span><span lang="'+lang+'">'+a[lang]+'</span></li>').join('')+'</ul>':'';
  $('#projectwrap').innerHTML=
   '<div class="hero"><img src="'+img(w,w.hero)+'" style="object-position:'+(w.pos||'50% 50%')+'" alt="'+w.en+'"><div class="cap"><div class="inner">'+
     '<span class="no mono">'+w.year+'  ·  '+genre(w)+'</span><h1>'+w.zh+'</h1><span class="en">'+w.en+'</span></div></div></div>'+
   '<div class="inner">'+
   '<div class="brief"><ul class="meta mono rise" style="--d:1">'+
     '<li><span>'+t('year')+'</span><span>'+w.year+'</span></li>'+
     '<li><span>'+t('genre')+'</span><span>'+genre(w)+'</span></li>'+
     '<li><span>'+t('role')+'</span><span>'+(w.ai?t('roleAi'):t('roleFilm'))+'</span></li></ul>'+
     '<div class="rise" style="--d:2"><p class="log" lang="'+lang+'">'+w.log[lang]+'</p><p class="log2" lang="'+other+'">'+w.log[other]+'</p>'+laurels+'</div></div>'+
   '<div class="stills">'+stills+'</div>'+
   '<nav class="pager" aria-label="More work"><a href="#'+prev.id+'"><span class="mono">← '+prev.en+'</span><span class="zh">'+prev.zh+'</span></a>'+
     '<a href="#'+next.id+'"><span class="mono">'+next.en+' →</span><span class="zh">'+next.zh+'</span></a></nav>'+
   '<div class="foot mono"><a href="#work" class="slash">'+t('all')+'</a><span>© 2026 Yifan Zhang</span></div></div>';
  lbList=[];for(let k=1;k<=w.n;k++)lbList.push(img(w,k));
  $('#projectwrap').querySelectorAll('.stills button').forEach(b=>b.addEventListener('click',()=>openLb(+b.dataset.k-1)));
}
function openLb(i){lbI=(i+lbList.length)%lbList.length;$('#lbimg').src=lbList[lbI];$('#lbcount').textContent=pad(lbI+1)+' / '+pad(lbList.length);$('#lb').classList.add('open');}
function closeLb(){$('#lb').classList.remove('open');}
$('#lbclose').onclick=closeLb;$('#lbprev').onclick=()=>openLb(lbI-1);$('#lbnext').onclick=()=>openLb(lbI+1);
$('#lb').addEventListener('click',e=>{if(e.target.id==='lb')closeLb();});
let sx=null;$('#lb').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;},{passive:true});
$('#lb').addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>40)openLb(lbI+(dx<0?1:-1));sx=null;});
addEventListener('keydown',e=>{
  if($('#lb').classList.contains('open')){if(e.key==='Escape')closeLb();if(e.key==='ArrowRight')openLb(lbI+1);if(e.key==='ArrowLeft')openLb(lbI-1);return;}
  if(e.key==='Escape'&&location.hash&&location.hash!=='#')location.hash='';
});

/* ---------- language ---------- */
function applyLang(){
  document.documentElement.lang=lang==='zh'?'zh-Hans':'en';
  document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));
  $('#lang-en').setAttribute('aria-pressed',lang==='en');$('#lang-zh').setAttribute('aria-pressed',lang==='zh');
  renderWork();renderAbout();renderNote();
  const w=WORKS.find(x=>'#'+x.id===location.hash);if(w)renderProject(w);
}
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;try{localStorage.setItem('yz-lang',lang);}catch(e){}applyLang();}));

/* ---------- routing ---------- */
const views={work:$('#work'),about:$('#about'),note:$('#note'),project:$('#project')};
function route(){
  const h=(location.hash||'').slice(1);
  const w=WORKS.find(x=>x.id===h);
  const key=w?'project':(h==='work'||h==='about'||h==='note'?h:'');
  Object.entries(views).forEach(([k,v])=>v.classList.toggle('open',k===key));
  document.body.classList.toggle('at-home',key==='');
  document.body.classList.toggle('away',key==='work'||key==='about'||key==='note');
  document.body.classList.toggle('deep',key==='project');
  document.querySelectorAll('.nav .links a').forEach(a=>{if(a.getAttribute('href')==='#'+key)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  if(w){renderProject(w);views.project.scrollTop=0;feature(WORKS.indexOf(w));}
  else if(key){views[key].scrollTop=0;const v=views[key];v.classList.remove('open');void v.offsetWidth;v.classList.add('open');}
  $('#peek').classList.remove('show');
  closeLb();
}
document.querySelector('.nav .home').addEventListener('click',e=>{e.preventDefault();if(location.hash&&location.hash!=='#')location.hash='';else{route();home.scrollTo({top:0,behavior:'smooth'});}});
addEventListener('hashchange',route);

/* ---------- boot ---------- */
document.body.classList.add('intro');
applyLang();
feature(0);
route();
setTimeout(()=>$('#stage').classList.remove('boot'),500);
setTimeout(()=>{WORKS.forEach(w=>{const im=new Image();im.src=img(w,w.hero);});},2200);
startCycle();
setTimeout(()=>document.body.classList.remove('intro'),4200);
})();
</script>
</body>
</html>
